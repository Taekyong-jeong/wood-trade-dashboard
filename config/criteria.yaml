# ─────────────────────────────────────────────────────────────
# 판정 기준과 레퍼런스 (2026-10-22 확정)
# ─────────────────────────────────────────────────────────────
# 대시보드의 모든 판정 배지(취약·주의·안정, 비정상·다소 높음 등)는 이 파일의 규칙으로만 결정함.
# 값을 바꾸면 다음 갱신 때 반영됨. 바꿀 때는 근거를 README 변경 이력에 남길 것.
# ─────────────────────────────────────────────────────────────

# ① 수입 집중 (공급 위험 1차 선별) — 수입이 특정 국가에 몰린 정도. 국내 대체 여력은 ⑤에서 따로 봄
supply_risk:
  window: L12M                    # 최근 12개월 수입액 기준
  vulnerable:                     # 취약: 아래 두 조건을 모두 충족
    min_import_usd: 1000000       #   연 수입액 100만 달러 이상
    top_country_share_pct: 50     #   특정국(최대 공급국) 의존도 50% 이상
  caution_hhi: 2500               # 주의: 취약은 아니지만 HHI 2,500 이상 (고집중)
                                  # 연 수입액 100만 달러 미만 품목은 모든 등급에서 '판정 제외' (산업부 기준의 최소 규모 적용)
  hhi_bands: [1500, 2500]         # HHI 구간 표시: 1,500 미만 분산 · 1,500~2,500 보통 · 2,500 이상 집중
  refs: [motie2023, doj2010, doj2023]

# ② 수입 의존 — 국내 수요 중 수입 비율 (수입침투율)
import_penetration:
  definition: "수입 ÷ (국내 생산 − 수출 + 수입)"
  applied: "원목: 100 − 원목자급률 (산림청 목재수급통계, ㎥ 기준)"
  trend_test: mann_kendall        # 추세 판정: Mann-Kendall 비모수 추세 검정
  trend_years: 10                 # 최근 10년
  alpha: 0.05                     # 유의수준 5% — 유의하면 상승/하락, 아니면 '뚜렷한 추세 없음'
  refs: [oecd_stan, mann1945, kendall1975]

# ③ 가격 이상 — 수입 단가 상승률이 과거 같은 달에 비해 얼마나 벗어났나
price_anomaly:
  method: IFPA                    # FAO 식품가격 이상 지표(SDG 2.c.1) 방법을 수입 단가에 적용
  gamma: 0.4                      # 분기 성장률 가중치 (연간 성장률 0.6)
  bands:                          # 표준화 점수(σ)
    abnormal: 1.0                 #   ≥ 1.0  비정상 상승
    moderate: 0.5                 #   0.5~1.0 다소 높음,  −0.5~0.5 정상
  symmetric_low: true             # 하락 쪽도 대칭 적용 (본 대시보드 확장, FAO 원 지표는 상승만 정의)
  min_past_years: 3               # 과거 같은 달 관측이 3개 미만이면 판정 보류
  min_month_import_usd: 1000000   # 해당 월 수입액 100만 달러 미만이면 단가가 불안정해 계산 제외
  weights: equal                  # 과거 관측 동일 가중 (FAO는 시간 가중 — 단순화)
  items:                          # 판정 대상 (수입이 꾸준한 품목)
    - "heading:4403"   # 원목
    - "product:p01"    # 제재목
    - "product:p06"    # 합판
    - "product:p07"    # 파티클보드
    - "product:p08"    # 섬유판
    - "product:p09"    # OSB
    - "product:p10"    # 목질바닥재
    - "product:p11"    # 목재펠릿
    - "product:p12"    # 목재칩
    - "product:p15"    # 목탄
    - "product:p17"    # LVL
  refs: [fao_ifpa]

# ④ 변화 요인 — 수입액 변화를 물량 효과와 단가 효과로 분해
decomposition:
  method: LMDI                    # 로그평균 디비지아 지수분해 (가법형)
  level: HS6                      # HS 6단위 품목별로 분해 후 합산 (품목 구성 변화 영향 축소)
  compare: "최근 12개월 vs 직전 12개월"
  dominant_share: 0.6             # 한 효과가 변화의 60% 이상이면 '물량 주도' / '단가 주도'
  refs: [ang2005]

# ⑤ 국내 공급 여력 — 수입이 막혔을 때 국내 생산으로 메울 수 있는 정도 (목재이용실태조사)
domestic_supply:
  source: "산림청·한국임업진흥원 「목재이용실태조사」 (연 1회, data/external/wood_use_survey.csv)"
  import_share: "수입량 ÷ (국내 생산량 + 수입량) × 100 — 물량(㎥·톤) 기준 수입 비중 (수출은 물량 자료가 없어 제외, OECD 수입침투율의 근사)"
  trend_test: mann_kendall        # 수입 비중 추세: 5개년 이상일 때만 검정, α 0.05
  trend_min_years: 5
  alpha: 0.05
  utilization: "연 생산량 ÷ 최대 생산가능량 × 100 (실태조사 정의). 공표값이 없는 품목은 실태조사 항목으로 산출하고 '산출'·'참고치'로 표시"
  spare_cover: "여유 생산능력 ÷ 수입량 × 100, 여유 생산능력 = 국내 생산량 × (100 ÷ 가동률 − 1)"
  spare_cover_line: 100           # 100% 이상 = 국내 여유 생산능력만으로 현재 수입량을 모두 생산 가능 (정의상 경계, 임의 기준 아님)
  note: "원료(원목·부산물) 조달, 품질·규격 차이, 가격 경쟁력은 반영하지 않은 물리적 상한임. 등급을 매기지 않고 수치만 제시함"
  refs: [kfs_wus, oecd_stan, mann1945, kendall1975]

# ⑥ 부피 환산 밀도 — 산림청 임산물수출입통계와 같은 환산계수 사용 (2026-11-01 개정)
#   대조 결과: 산림청 임산물수출입통계의 수입 물량(천㎥)은 2016~2025년 모든 연도에서 '관세청 순중량 ÷ 고정 계수'와 일치함
#   (원목 0.855 · 제재목 0.60 · 단판 0.50 · 합판 0.65 · 파티클보드 0.65 · 섬유판 0.70 t/㎥). 즉 공표 ㎥ 자체가 환산값이며 실측 부피가 아님.
#   → ㎥ 환산은 이 계수를 그대로 씀 (공표 통계와 ㎥ 기준 일치). 목재이용실태조사 ㎥는 임산물수출입통계를 옮긴 값이거나
#     (2016~2019) 품목 범위가 다른 값(2020~2023 제재목)이라 밀도 산출에 쓰지 않음. 원목은 실태조사 '수입 원목 이용량' 기준값을 검증용으로 병기
density_calibration:
  source: "산림청 임산물수출입통계 품목별현황(수입, 연 누계) — data/external/kfs_trade.csv"
  method: "연도별 관세청 수입 순중량(t) ÷ 산림청 수입 물량(㎥)의 중앙값 = 산림청 환산계수"
  constant_tol: 0.01              # 연도별 값의 최대−최소가 0.01 t/㎥ 이하면 '고정 계수 확인'으로 표시
  scope_check_pct: 2              # 관세청 수입액이 산림청 수입액과 ±2% 넘게 다른 해는 범위 불일치로 제외
  items:                          # 대시보드 분류 → [관세청 HS 범위, 산림청 중분류]
    "product:p01": [["4407"], "제재목"]
    "heading:4407": [["4407"], "제재목"]
    "heading:4408": [["4408"], "단판"]
    "product:p06": [["4412"], "합판"]
    "product:p08": [["4411"], "섬유판"]
    "product:p07": [["4410"], "파티클보드"]
    "heading:4403": [["4403"], "원목"]
  check_survey: {"heading:4403": [total, log_use_imported]}   # 검증용: 관세청 원목 중량 ÷ 실태조사 수입 원목 이용량(㎥)
  formula: "USD/㎥ = (수입액 ÷ 순중량 kg × 1,000) × 밀도(t/㎥) = USD/t × 밀도"
  refs: [kfs_trade, kfs_wus]

# ⑥-2 산림청 공표치 대조 — 관세청 수집값이 산림청 임산물수출입통계와 같은지 매년 확인 (판정 아님, 검증)
kfs_check:
  source: "data/external/kfs_trade.csv (산림청 임산물수출입통계 품목별현황, 수입, 연 누계)"
  map:                            # 산림청 중분류 → 관세청 HS 4단위 (건축목공+마루판 = 4418)
    "원목": "4403"
    "제재목": "4407"
    "단판": "4408"
    "성형목재": "4409"
    "파티클보드": "4410"
    "섬유판": "4411"
    "합판": "4412"
    "건축목공": "4418"
    "마루판": "4418"
    "목탄": "4402"
    "펠릿(칩)": "4401"
  tol_pct: 1                      # 수입액 차이 ±1% 이내면 '일치'
  notes:                          # 차이 원인 확인 결과 (사실/추정 구분)
    "4402-2025": "2025년 차이(2,983만 달러)는 2025년 신설 HSK 7개 코드(4402.10.1010·1090, 4402.20.1010·1090, 4402.90.1011·1019, 4402.90.9020) 수입액 합계와 일치(사실). 산림청 2025년 집계에 신설 코드가 빠진 것으로 추정. 2026년 1~9월은 일치"
  refs: [kfs_trade]

# ⑦ 국산·수입 가격 수준 — 산림조합 판매단가와 관세청 수입 단가 비교 (판정 없음, 참고)
domestic_price:
  source: "산림조합중앙회 목재유통센터 「2026년도 목재 제품 판매단가」 (A급, 면세단가, 연 1회) — data/external/kfcf_price.csv"
  volume: "㎥ = 두께 × 폭 × 길이 (mm → m), 才 표기와 대조 (1㎥ = 299.5才)"
  fx_krw_per_usd: 1422            # 2025년 연평균 원/달러 (한국은행 자료 기준, KB국민은행 2025.12.31 정리). 단가표 연도가 바뀌면 직전 연도 연평균으로 갱신
  fx_basis: "2025년 연평균 원/달러 1,422원 (한국은행·KB국민은행)"
  stat: median                    # 규격별 ㎥당 가격의 중앙값 (범위도 함께 표시)
  min_import_usd: 1000000         # 비교 대상 수입이 최근 12개월 100만 달러 미만이면 '규모 미달'로 표시만 함 (①과 같은 최소 규모)
  survey_note: "목재이용실태조사의 제재목 수입액(2023년 6억 4,574만·2024년 6억 1,020만 달러)은 산림청 임산물수출입통계의 제재목·단판·성형목재 수입액 합계와 두 해 모두 일치해 범위가 4407~4409로 넓은 것으로 추정 — 비교에서 제외"
  species_note: "수종별 수입 단가는 수종마다 밀도·함수율이 달라 단일 밀도로 ㎥ 환산하면 왜곡되므로, 수종 비교는 하지 않고 제재목 전체 평균과 비교함"
  pairs:
    - label: "낙엽송 제재목"
      domestic: {category: "낙엽송 각·판재", treatment: "일반"}
      imports:
        - {label: "수입 제재목 전체 (최근 12개월, 산림청 계수 환산)", hs: ["4407"], density_item: "product:p01"}
        - {label: "수입 제재목 (2025, 산림청 공표 ㎥ 기준)", kfs: "제재목", kfs_year: 2025}
        - {label: "수입 낙엽송 제재목", hs: ["4407194000"], density_item: "product:p01"}
    - label: "수장용 집성재(집성판)"
      domestic: {category: "수장용집성재", treatment: "일반"}
      imports:
        - {label: "수입 집성판 (가구·내장용, 최근 12개월)", hs: ["4421999010", "4418992000"], density_item: "product:p05"}
    - label: "구조용 집성재"
      domestic: null
      domestic_missing: "산림조합 2026 판매단가표에 품목은 있으나 단가 공란"
      imports:
        - {label: "수입 구조용 집성재 (HS 4418.81, 최근 12개월)", hs: ["441881"], density_item: "product:p05"}
    - label: "CLT(직교적층재)"
      domestic: null
      domestic_missing: "산림조합 2026 판매단가표에 품목(3·5ply)은 있으나 단가 공란"
      imports:
        - {label: "수입 CLT (HS 4418.82, 최근 12개월)", hs: ["441882"], density_item: "product:p16"}
  note: "수입은 CIF(관세·통관·내륙운송·유통 마진 전), 국산은 산지 판매가(면세). 같은 단계의 가격이 아니므로 가격 수준 차이를 보는 참고 지표이며 경쟁력 판정에 쓰지 않음. 집성판 수입은 HSK 4421.99-9010 「집성판(건축자재를 제외한다)」(2025년 신설, 2024년까지 4418.99-2000) — 국산 수장용 집성재와 같은 가구·내장용. 구조용 집성재(4418.81)·CLT(4418.82)는 국산 단가가 공란이라 수입 단가만 표시(배수 계산 안 함), 원주목은 대응 품목 없음"
  refs: [kfcf2026, bok_fx, kfs_trade]

# 레퍼런스
references:
  kfcf2026: "산림조합중앙회 목재유통센터 (2026.1). 2026년도 목재 제품 판매단가 (https://www.woodkorea.or.kr)"
  bok_fx: "한국은행 경제통계시스템 원/달러 환율 — 2025년 연평균 1,422원 (KB국민은행 자본시장사업그룹 2025.12.31 환율 전망 정리)"
  kfs_trade: "산림청 임산물수출입통계 — 품목별현황(수입, 연 누계), 산림청 누리집 행정정보 > 산림통계 (2026-11-01 조회). 관세청 수출입 자료를 산림청 임산물 HSK 코드로 집계한 공표치"
  kfs_wus: "산림청·한국임업진흥원 (2025.11). 2024년 기준 목재이용실태조사 보고서 (국가승인통계) 및 2023년 기준 보고서 정오표(2025.11.26). 2012~2024년 기준 보고서 연도별 발간"
  motie2023: "산업통상자원부 (2023.12.13). 산업 공급망 3050 전략 — 공급망 안정품목 1차 선정 기준: 수입액 100만 달러 이상, 특정국 수입의존도 50% 이상"
  doj2010: "U.S. Department of Justice & Federal Trade Commission (2010). Horizontal Merger Guidelines, §5.3 — HHI 1,500 미만 비집중, 1,500~2,500 중간 집중, 2,500 초과 고집중"
  doj2023: "U.S. DOJ & FTC (2023). Merger Guidelines — 고집중 기준을 1,800으로 강화 (본 대시보드는 무역 분석에서 널리 쓰는 2010 구간 사용)"
  oecd_stan: "OECD STAN Indicators — Import penetration: 수입 ÷ 국내 수요(생산 − 수출 + 수입)"
  mann1945: "Mann, H. B. (1945). Nonparametric tests against trend. Econometrica, 13(3), 245–259"
  kendall1975: "Kendall, M. G. (1975). Rank Correlation Methods (4th ed.). Charles Griffin, London"
  fao_ifpa: "FAO. SDG Indicator 2.c.1 메타데이터 — Indicator of Food Price Anomalies (IFPA): 분기·연간 복합성장률을 과거 같은 달 기준으로 표준화, γ=0.4, 0.5σ·1σ 구간"
  ang2005: "Ang, B. W. (2005). The LMDI approach to decomposition analysis: a practical guide. Energy Policy, 33(7), 867–871"
