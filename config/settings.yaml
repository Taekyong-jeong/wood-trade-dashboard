# 수집·운영 설정 (자유롭게 수정 가능)

start_month: "201601"        # 시계열 시작월 (약 10년). 늘리거나 줄여도 됨
publish_day: 16              # 이 날짜 이후면 전월 통계가 공표된 것으로 간주
refresh_months: 12           # 매월 다시 받아 덮어쓰는 최근 개월 수 (잠정치→확정치)

max_calls_per_run: 9000      # 1회 실행 최대 호출 수 (개발계정 일일 한도 10,000)
max_minutes_per_run: 240     # 1회 실행 시간 예산(분). GitHub 작업 한도 안에서 저장 후 종료
delay_sec: 0.05              # 호출 간 대기
timeout_sec: 60
retry_max: 4

validation:
  max_mom_change_pct: 50     # 44류 수입 합계가 전월 대비 ±50% 넘게 변하면 게시 중단
