# ─────────────────────────────────────────────────────────────
# 목재류 무역통계 대시보드 — 분류 체계
# ─────────────────────────────────────────────────────────────
# 규칙
# - 각 분류는 HS 코드 "접두어(prefix)" 목록으로 정의한다.
#   예) "4407"   → 4407로 시작하는 모든 HSK 10단위 코드
#       "441881" → HS 6단위 4418.81 (집성재)
#       "4402901000" → HSK 10단위 하나만 지정
# - 한 코드가 여러 접두어에 걸리면 "가장 긴 접두어"가 이긴다 (품목군 분류).
# - 목재제품(products)·수종(species)은 품목군과 독립된 별도 축이다.
# - since: 해당 HS 코드가 생긴 시점. 그 이전 데이터는 다른 코드에 섞여 있다.
# - 이 파일을 고치면 다음 갱신 때 대시보드에 자동 반영된다.
#   (수정 이력은 README 변경 이력에 남길 것)
# ─────────────────────────────────────────────────────────────

chapter: "44"

# HS 개정 시점 (시계열 단절 표시용)
hs_revisions:
  - { month: "2017-01", name: "HS 2017" }
  - { month: "2022-01", name: "HS 2022" }

# ① 품목군 (8개) — 44류 전체를 빠짐없이 나눈다
groups:
  - key: raw
    name: 원자재
    desc: 원목, 목재칩 등 가공 전 원료
    prefixes: ["4403", "440121", "440122", "4404", "4405", "4406"]
  - key: primary
    name: 1차 가공재
    desc: 제재목, 단판, 성형목재(마루재 포함)
    prefixes: ["4407", "4408", "4409"]
  - key: panel
    name: 보드·패널
    desc: 파티클보드·OSB, 섬유판, 합판, 강화목재
    prefixes: ["4410", "4411", "4412", "4413"]
  - key: ewp
    name: 구조용 공학목재
    desc: 집성재, CLT, I형 장선, 기타 공학목재, LVL (HS 2022~)
    prefixes: ["441881", "441882", "441883", "441889", "441241", "441242", "441249"]
  - key: building
    name: 건축용 목제품
    desc: 창호, 문, 거푸집, 마루판, 기둥·보 등
    prefixes: ["4418"]
  - key: bioenergy
    name: 바이오에너지
    desc: 연료용 목재, 목재펠릿, 브리켓, 톱밥, 목탄
    prefixes: ["4401", "4402"]
  - key: packaging
    name: 포장·물류
    desc: 팔레트, 상자, 통
    prefixes: ["4415", "4416"]
  - key: consumer
    name: 생활 목제품
    desc: 액자, 공구자루, 식탁·주방용품, 장식품, 기타 목제품
    prefixes: ["4414", "4417", "4419", "4420", "4421"]

# 가공 단계 구조 분석에 쓰는 품목군 순서
processing_stages: [raw, primary, panel, ewp]

# ② 목재제품 — 「목재의 지속가능한 이용에 관한 법률」 규격·품질 기준 15종 + CLT + LVL
#   status: ok        → HS 코드로 분리 가능
#           partial   → 일부만 분리 가능 (note 참고)
#           pending   → HS 6단위 전용 코드 없음. HSK 10단위 품목명 확인 후 확정
products:
  - { key: p01, num: 1,  name: 제재목,           prefixes: ["4407"], status: ok }
  - { key: p02, num: 2,  name: 방부목재,         prefixes: ["440311", "440312", "4407111010", "4407122010", "4407131000"], status: partial,
      since: "2022-01",
      note: "처리 원목(4403.11·12) + 방부처리 제재목(적송·가문비·SPF, HSK 2022~). 그 외 수종의 방부 제재목은 분리 불가" }
  - { key: p03, num: 3,  name: 난연목재,         prefixes: ["4407111020", "4407122020", "4407132000"], status: partial,
      since: "2022-01",
      note: "난연처리 제재목(적송·가문비·SPF, HSK 2022~)만 분리 가능" }
  - { key: p04, num: 4,  name: 목재플라스틱복합재, prefixes: [], status: pending,
      note: "HS·HSK 모두 전용 코드 없음 (주로 39류 플라스틱제품으로 분류). 무역통계로 추적 불가" }
  - { key: p05, num: 5,  name: 집성재,           prefixes: ["441881"], status: ok, since: "2022-01",
      note: "2021년 이전은 4418.99(기타)에 포함" }
  - { key: p06, num: 6,  name: 합판,             prefixes: ["441231", "441233", "441234", "441239"], status: ok }
  - { key: p07, num: 7,  name: 파티클보드,       prefixes: ["441011", "441019"], status: ok }
  - { key: p08, num: 8,  name: 섬유판,           prefixes: ["4411"], status: ok }
  - { key: p09, num: 9,  name: 배향성스트랜드보드(OSB), prefixes: ["441012"], status: ok }
  - { key: p10, num: 10, name: 목질바닥재,       prefixes: ["4409", "441873", "441874", "441875", "441879"], status: ok,
      note: "성형목재(4409) + 조립 마루판(4418.73~79)" }
  - { key: p11, num: 11, name: 목재펠릿,         prefixes: ["440131"], status: ok }
  - { key: p12, num: 12, name: 목재칩,           prefixes: ["440121", "440122"], status: ok }
  - { key: p13, num: 13, name: 목재브리켓,       prefixes: ["440132"], status: ok, since: "2022-01",
      note: "2021년 이전은 4401.39(기타 응결품)에 포함" }
  - { key: p14, num: 14, name: 성형목탄,         prefixes: ["44021010", "44022010", "44029010"], status: ok, since: "2022-01",
      note: "HSK 2022~ 별도 코드. 2021년 이전은 목탄에 포함" }
  - { key: p15, num: 15, name: 목탄,             prefixes: ["4402"], status: ok,
      note: "성형목탄 포함" }
  - { key: p16, num: 16, name: CLT(직교적층재),  prefixes: ["441882"], status: ok, since: "2022-01",
      note: "2021년 이전은 4418.99(기타)에 포함" }
  - { key: p17, num: 17, name: LVL(단판적층재),  prefixes: ["441241", "441242", "441249"], status: ok, since: "2022-01",
      note: "2021년 이전은 4412.99(기타 합판류)에 포함" }

