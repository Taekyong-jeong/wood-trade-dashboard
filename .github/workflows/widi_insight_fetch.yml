name: WIDI 해설 외부 지표 수집

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/external/widi_insight_fetch.py", ".github/workflows/widi_insight_fetch.yml"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 외부 지표 받기
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS }}
        run: python scripts/external/widi_insight_fetch.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external/eurostat_*.json data/external/statcan_*.csv data/external/kosis_sawn_use.json data/external/kosis_construction_done.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "WIDI 해설 외부 지표 원자료"
          git pull --rebase
          git push
