name: 데이터 수집·대시보드 갱신

on:
  schedule:
    # 매일 10:13 KST (01:13 UTC): 과거 데이터 채우기(backfill). 다 채워지면 호출 없이 끝남
    - cron: "13 1 * * *"
    # 매월 20일 10:43 KST (01:43 UTC): 최신월 수집 + 최근 12개월 재수집
    - cron: "43 1 20 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [backfill, monthly, probe]
        default: backfill
      max_calls:
        description: "최대 호출 수 (일일 한도 10,000)"
        default: "9000"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "max=${{ inputs.max_calls }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 1 20 * *" ]; then
            echo "mode=monthly" >> "$GITHUB_OUTPUT"; echo "max=9000" >> "$GITHUB_OUTPUT"
          else
            echo "mode=backfill" >> "$GITHUB_OUTPUT"; echo "max=9000" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집 (관세청 API)
        id: fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch.py --mode ${{ steps.mode.outputs.mode }} --max-calls ${{ steps.mode.outputs.max }}

      - name: 분석 + 검증
        id: analyze
        if: steps.mode.outputs.mode != 'probe'
        continue-on-error: true
        run: python scripts/analyze.py

      - name: 글꼴 내려받기 (에스코어드림, 최초 1회)
        if: steps.mode.outputs.mode != 'probe'
        run: |
          mkdir -p docs/fonts
          for w in 3Light 4Regular 5Medium 6Bold; do
            f="docs/fonts/S-CoreDream-$w.woff"
            [ -s "$f" ] || curl -fsSL -o "$f" "https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-$w.woff" || echo "글꼴 $w 실패 (CDN으로 대체)"
          done

      - name: 페이지 생성
        if: steps.mode.outputs.mode != 'probe'
        run: python scripts/build.py

      - name: 결과 커밋
        if: always() && steps.mode.outputs.mode != 'probe'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 ($(TZ=Asia/Seoul date +%F) ${{ steps.mode.outputs.mode }})"
            git push
          fi

      - name: 검증 실패 알림
        if: steps.analyze.outcome == 'failure'
        run: |
          echo "::error::검증 실패 — 기존 페이지를 유지하고 '갱신 지연'으로 표시함. docs/data/meta.json의 status_msg 확인"
          exit 1
