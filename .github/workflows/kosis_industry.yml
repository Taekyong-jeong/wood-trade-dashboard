name: 목재산업 통계 수집 (KOSIS)

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 25 * *"   # 매월 25일 11:37 KST (월별 산업활동 지수 반영)
  push:
    branches: [main]
    paths: ["scripts/external/kosis_industry_fetch.py", ".github/workflows/kosis_industry.yml"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 산업 통계 받기
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS }}
        run: python scripts/external/kosis_industry_fetch.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external/kosis_industry.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "목재산업 통계 원자료 (KOSIS)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done
